{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>{{ error_code }} - Свод</title>

  <link
    rel="stylesheet"
    href="{% static 'showcase/css/errors.css' %}"
  >
</head>

<body>
  <main class="container">
    <header class="topbar">
      <a
        class="brand"
        href="{% url 'showcase:product_showcase' %}"
      >
        Свод
      </a>

      <p class="status">
        Служебная страница
      </p>
    </header>

    <section
      class="error"
      aria-labelledby="error-title"
    >
      <div class="error__main">
        <p class="error__eyebrow">
          {{ error_eyebrow }}
        </p>

        <p
          class="error__code"
          aria-label="Код ошибки {{ error_code }}"
        >
          {{ error_code }}
        </p>

        <h1
          id="error-title"
          class="error__title"
        >
          {{ error_title_before }}
          <strong>{{ error_title_emphasis }}</strong>
        </h1>
      </div>

      <div class="error__aside">
        <p class="error__text">
          {{ error_description }}
        </p>

        <a
          class="error__action"
          href="{% url 'showcase:product_showcase' %}"
        >
          Вернуться к витрине
        </a>
      </div>
    </section>

    <footer class="error__meta">
      <span>Код ответа · {{ error_code }}</span>
      <span>Свод · витрина офферов</span>
    </footer>
  </main>
</body>
</html>
