name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        working-directory: project
        env:
          SECRET_KEY: ci-only-secret-key
        run: |
          python manage.py test showcase \
            --settings=project.test_settings

  build:
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" \
            >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production
      url: https://finparus.ru

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Copy production compose file
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          scp compose.prod.yaml \
            "${SERVER_USER}@${SERVER_HOST}:/opt/finparus/compose.prod.yaml"

      - name: Deploy
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          ssh "${SERVER_USER}@${SERVER_HOST}" \
            "cd /opt/finparus && \
             APP_IMAGE='${IMAGE}' docker compose \
               -f compose.prod.yaml pull web && \
             APP_IMAGE='${IMAGE}' docker compose \
               -f compose.prod.yaml up -d db && \
             APP_IMAGE='${IMAGE}' docker compose \
               -f compose.prod.yaml run --rm web \
               python manage.py migrate --noinput && \
             APP_IMAGE='${IMAGE}' docker compose \
               -f compose.prod.yaml run --rm web \
               python manage.py collectstatic --noinput && \
             APP_IMAGE='${IMAGE}' docker compose \
               -f compose.prod.yaml up -d && \
             APP_IMAGE='${IMAGE}' docker compose \
               -f compose.prod.yaml ps"
